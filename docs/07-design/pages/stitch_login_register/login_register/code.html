<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {

                        "error-container": "#ffdad6",

                        "inverse-on-surface": "#eff1f3",

                        "tertiary-fixed": "#eaddff",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-container": "#8343f4",
                        "surface-bright": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "on-tertiary-fixed": "#25005a",
                        "on-background": "#191c1e",
                        "secondary-container": "#d5e3fc",
                        "tertiary-fixed-dim": "#d2bbff",
                        "secondary": "#515f74",
                        "primary": "#004ac6",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#6a1edb",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#57657a",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "on-primary-fixed": "#00174b",
                        "surface-container-high": "#e6e8ea",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#434655",
                        "surface-tint": "#0053db",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#0d1c2e",
                        "outline-variant": "#c3c6d7",
                        "secondary-fixed-dim": "#b9c7df",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-container": "#f7edff",
                        "surface-dim": "#d8dadc",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#003ea8",
                        "background": "#f7f9fb",
                        "surface": "#f7f9fb"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
        .modal-overlay {
            background: rgba(25, 28, 30, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- Mock Homepage Content (Blurred) -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none filter blur-sm grayscale-[0.2]">
<!-- TopAppBar (Suppressed Action but visible for context) -->
<header class="fixed top-0 w-full z-50 h-14 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 flex items-center justify-between px-6">
<div class="text-xl font-bold tracking-tighter text-slate-900">The Curated Navigator</div>
<div class="flex gap-4 items-center">
<span class="text-slate-500 font-medium text-sm">London</span>
<span class="text-slate-500 font-medium text-sm">Manchester</span>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-20 px-8 max-w-7xl mx-auto grid grid-cols-12 gap-8">
<div class="col-span-12 md:col-span-8">
<div class="h-96 w-full bg-surface-container rounded-xl overflow-hidden mb-8">
<img class="w-full h-full object-cover" data-alt="luxury london apartment interior with floor to ceiling windows overlooking the city skyline at dusk" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR_qJ4pjF_HiXG7DhupDF5SlRI9f8fmstm1Zem0gtNPHny3I9hLJ94VI-Y4Sg8YHA0HQF7KX4yUk8wYpbzcgj_PW9mL7_71ciULtIQT1HAAC7qo0z8V4yWn2kvWhiumi_O8RD1S2PUHgGJokvzJRHbTFXsiwKMxZlaXy8oIav-P4C1Hs7oe1AbYA4LbPbDjFpKN-b0ai-5GXbpvYdvepozGPNiaWayZxhOlV1htBCl7guRcehXtEf3EUtz31rrxayFxH2ldMDQixQ2"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-48 bg-surface-container-low rounded-xl"></div>
<div class="h-48 bg-surface-container-low rounded-xl"></div>
</div>
</div>
<div class="col-span-4 hidden md:block">
<div class="w-full h-[600px] bg-surface-container rounded-xl border border-outline-variant/15 flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-6xl">map</span>
</div>
</div>
</main>
</div>
<!-- Login/Register Modal Overlay -->
<div class="fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
<!-- Modal Card: 400px wide, 16px radius, large shadow -->
<div class="w-full max-w-[400px] bg-surface-container-lowest rounded-[16px] shadow-[0_12px_32px_rgba(15,23,42,0.12)] overflow-hidden flex flex-col">
<!-- Close Button -->
<div class="flex justify-end p-4 pb-0">
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Header: Logo + Tagline -->
<div class="px-8 pt-2 pb-6 text-center">
<div class="text-2xl font-black tracking-tighter text-primary mb-1">The Curated Navigator</div>
<p class="text-on-surface-variant text-sm font-medium">See all UK rentals on one map</p>
</div>
<!-- Tabs: Login and Register -->
<div class="flex px-8 border-b border-outline-variant/15">
<button class="flex-1 py-3 text-sm font-bold text-primary border-b-2 border-primary transition-all">
                    Login
                </button>
<button class="flex-1 py-3 text-sm font-semibold text-on-surface-variant hover:text-on-surface transition-all">
                    Register
                </button>
</div>
<!-- Login Form (Active State) -->
<div class="p-8 space-y-5">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1">Email Address</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-low border-0 rounded-lg text-sm focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all placeholder:text-outline" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Password</label>
<a class="text-[11px] font-bold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-low border-0 rounded-lg text-sm focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Login
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<!-- Alternative Social Login -->
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-surface-container-lowest px-2 text-outline font-medium uppercase tracking-tighter">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 h-11 border border-outline-variant/30 rounded-lg hover:bg-surface-container-low transition-colors">
<img alt="Google" class="w-4 h-4 grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYHEv8hbodT4gLbLZxQM3Zr0egJpn3J50-no7tA2U9a1iGpB2fFlm892pDLOTkOIarhsTJpTrIkI5BoieC8yklwGStmkZpLNNWy0TCUkFftPGAa_s-Hc2ti8PaDJfzsFqyfAwE-z6K8G6amk25TW83T3WtKO2gEXOROfA09NTBCRkXfijby42QyGfvBq-5zUaUjIfpC5uo7ZpdzmoE7HbCshAhzIrbn79j_QYaI_HR1XADdk6_omsx4qZIpMV5wEkA9nZd4EqRGFAt"/>
<span class="text-xs font-bold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-11 border border-outline-variant/30 rounded-lg hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-lg text-on-surface">ios</span>
<span class="text-xs font-bold text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Switcher -->
<div class="mt-auto bg-surface-container-low p-6 text-center border-t border-outline-variant/15">
<p class="text-xs font-medium text-on-surface-variant">
                    No account? 
                    <button class="text-primary font-bold ml-1 hover:underline">Register now</button>
</p>
</div>
</div>
</div>
<!-- Hidden Template for Register State (Logic separation reference) -->
<div class="hidden">
<!-- Register State Fields -->
<input class="rounded-lg" placeholder="Nickname" type="text"/>
<p class="text-xs text-outline">Verification email will be sent</p>
<div class="flex items-start gap-2">
<input class="rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="text-xs text-on-surface-variant">I agree to the Privacy Policy</span>
</div>
</div>
</body></html>
